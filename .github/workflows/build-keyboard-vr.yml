name: Build Keyboard VR Driver

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install "conan>=2,<3"

      - name: Detect Conan profile
        shell: pwsh
        run: |
          $env:CONAN_HOME = "${{ github.workspace }}\.conan2"
          conan profile detect --force

      - name: Install OpenVR SDK
        shell: pwsh
        run: |
          Write-Host "Downloading OpenVR SDK..."

          git clone --depth 1 https://github.com/ValveSoftware/openvr.git openvr-sdk

          if (!(Test-Path "openvr-sdk\headers\openvr_driver.h")) {
            Write-Error "OpenVR headers were not found."
            exit 1
          }

          if (!(Test-Path "openvr-sdk\lib\win64\openvr_api.lib")) {
            Write-Error "OpenVR win64 library was not found."
            Get-ChildItem "openvr-sdk\lib" -Recurse
            exit 1
          }

          Write-Host "OpenVR SDK found successfully."

      - name: Conan install
        shell: pwsh
        run: |
          $env:CONAN_HOME = "${{ github.workspace }}\.conan2"

          conan install . `
            --build=missing `
            -s build_type=Release `
            -s compiler.cppstd=20 `
            -c "tools.graph:skip_test=True" `
            -c "tools.build:skip_test=True" `
            -c "tools.cmake.cmaketoolchain:generator=Ninja Multi-Config"

      - name: Disable unit tests
        shell: pwsh
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE "CMakeLists.txt"

          if (!(Test-Path $file)) {
            Write-Error "CMakeLists.txt not found."
            exit 1
          }

          Write-Host "Disabling unit tests for CI..."

          $content = Get-Content $file -Raw

          # Disable the unconditional test commands.
          # Handles both LF and CRLF line endings.
          $content = $content -replace '(?m)^\s*enable_testing\(\)\s*$', '# enable_testing()'
          $content = $content -replace '(?m)^\s*add_subdirectory\s*\(\s*tests\s*\)\s*$', '# add_subdirectory(tests)'

          Set-Content $file $content -Encoding UTF8

          Write-Host ""
          Write-Host "===== VERIFYING TEST CONFIGURATION ====="

          # Look ONLY for active, uncommented add_subdirectory(tests)
          $activeTests = Select-String `
            -Path $file `
            -Pattern '^\s*add_subdirectory\s*\(\s*tests\s*\)\s*$' `
            -CaseSensitive

          if ($activeTests) {
            Write-Error "Tests are still enabled."
            Write-Host $activeTests
            exit 1
          }

          Write-Host "No active tests directory found."

          # Show the relevant lines for debugging.
          Write-Host ""
          Write-Host "===== TEST LINES ====="

          Select-String `
            -Path $file `
            -Pattern 'BUILD_TESTING|enable_testing|add_subdirectory.*tests'

          Write-Host ""
          Write-Host "Unit tests successfully disabled."

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Ninja Multi-Config" `
            -DBUILD_TESTING=OFF `
            -DBUILD_PREVIEW_APP=OFF `
            -DOPENVR_EMULATOR_SKIP_DEPLOY=ON `
            -DOPENVR_ROOT="${{ github.workspace }}\openvr-sdk" `
            -DOPENVR_LIB="${{ github.workspace }}\openvr-sdk\lib\win64\openvr_api.lib" `
            -DOPENVR_INCLUDE_DIR="${{ github.workspace }}\openvr-sdk\headers"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Find driver DLL
        shell: pwsh
        run: |
          Write-Host "Searching for driver DLL..."

          $dll = Get-ChildItem -Path . -Recurse `
            -Filter "driver_openvr-emulator.dll" |
            Where-Object {
              $_.FullName -notmatch "\\openvr-sdk\\"
            } |
            Select-Object -First 1

          if (-not $dll) {
            Write-Error "driver_openvr-emulator.dll was not found."
            exit 1
          }

          Write-Host "FOUND:"
          Write-Host $dll.FullName

      - name: Package driver
        shell: pwsh
        run: |
          $releaseDir = "release\openvr-emulator"
          $binDir = "$releaseDir\bin\win64"
          $resourceDir = "$releaseDir\resources"

          Write-Host "Creating package directories..."

          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          New-Item -ItemType Directory -Force -Path $resourceDir | Out-Null

          # ------------------------------------------------------
          # Find compiled DLL
          # ------------------------------------------------------

          Write-Host "Searching for driver DLL..."

          $dll = Get-ChildItem -Path . -Recurse `
            -Filter "driver_openvr-emulator.dll" |
            Where-Object {
              $_.FullName -notmatch "\\openvr-sdk\\"
            } |
            Select-Object -First 1

          if (-not $dll) {
            Write-Error "driver_openvr-emulator.dll not found."
            exit 1
          }

          Write-Host "Found DLL:"
          Write-Host $dll.FullName

          Copy-Item `
            $dll.FullName `
            "$binDir\driver_openvr-emulator.dll" `
            -Force

          # ------------------------------------------------------
          # Find built driver directory
          # ------------------------------------------------------

          $builtDriver = Join-Path `
            $env:GITHUB_WORKSPACE `
            "build\Release\openvr-emulator"

          if (!(Test-Path $builtDriver)) {
            Write-Error "Built driver directory not found: $builtDriver"
            exit 1
          }

          Write-Host ""
          Write-Host "Built driver directory:"
          Write-Host $builtDriver

          # ------------------------------------------------------
          # Manifest
          # ------------------------------------------------------

          $manifest = Join-Path `
            $builtDriver `
            "driver.vrdrivermanifest"

          if (!(Test-Path $manifest)) {
            Write-Error "driver.vrdrivermanifest not found."
            exit 1
          }

          Copy-Item `
            $manifest `
            "$releaseDir\driver.vrdrivermanifest" `
            -Force

          Write-Host "Manifest copied."

          # ------------------------------------------------------
          # Resources
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "Searching for resources..."

          $resourceCandidates = @(
            (Join-Path $builtDriver "resources"),
            (Join-Path $env:GITHUB_WORKSPACE "driver_files\driver\resources"),
            (Join-Path $env:GITHUB_WORKSPACE "resources")
          )

          $sourceResources = $null

          foreach ($candidate in $resourceCandidates) {
            if (Test-Path $candidate) {
              $sourceResources = $candidate
              break
            }
          }

          if ($sourceResources) {
            Write-Host "Found resources:"
            Write-Host $sourceResources

            Copy-Item `
              "$sourceResources\*" `
              $resourceDir `
              -Recurse `
              -Force
          }
          else {
            Write-Host "No separate resources directory found."
            Write-Host "Listing built driver contents:"

            Get-ChildItem `
              $builtDriver `
              -Recurse |
              ForEach-Object {
                Write-Host $_.FullName
              }
          }

          # ------------------------------------------------------
          # Verify package
          # ------------------------------------------------------

          Write-Host ""
          Write-Host "===== FINAL PACKAGE ====="

          Get-ChildItem `
            $releaseDir `
            -Recurse |
            ForEach-Object {
              Write-Host $_.FullName
            }

          $required = @(
            "$releaseDir\driver.vrdrivermanifest",
            "$binDir\driver_openvr-emulator.dll"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              Write-Error "Required file missing: $file"
              exit 1
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "Driver package created successfully."

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenVR-Emulation-KeyboardVR
          path: release\openvr-emulator
