; ============================================================
; OpenVR Emulation Driver - Keyboard VR Controller Mode
; ============================================================
;
; KeyboardVR - First Version
;
; HMD:
;   Phone + VRto3D can provide the HMD/head tracking.
;   Mouse look can be toggled with SPACE.
;
; Controllers:
;   Both virtual OpenVR controllers are controlled with keyboard.
;   The RIGHT controller additionally uses the physical mouse.
;
; Design rules:
;   - S is intentionally unused.
;   - M is intentionally unused.
;   - No Home/End/Insert/Delete/Page Up/Page Down mappings.
;   - Right rotation uses ONLY Numpad 8/2/4/6.
;   - LMB = RIGHT trigger.
;   - RMB = RIGHT grip.
;   - Each physical input has only one assigned controller action.
;
; Restart SteamVR after changing this file.
; ============================================================


[input]

; 1 = ignore XInput and use the keyboard/mouse mapping below.
; 0 = use the original Xbox/XInput behavior.
keyboard_only = 1


; ============================================================
; HMD / CAMERA
; ============================================================

[hmd]

; Mouse look
mouse_sensitivity = 0.003
key_mouse_toggle  = VK_SPACE
look_speed        = 1.5

; The HMD/head-tracking solution remains responsible for
; phone/VR HMD tracking.


; ============================================================
; LEFT VR CONTROLLER
; ============================================================

[left_controller]

; ------------------------------------------------------------
; LEFT JOYSTICK
; ------------------------------------------------------------
;
;          R
;          ^
;          |
;     F <--+--> G
;          |
;          v
;          D
;
joystick_up       = 0x52    ; R
joystick_down     = 0x44    ; D
joystick_left     = 0x46    ; F
joystick_right    = 0x47    ; G
joystick_click    = 0x43    ; C


; ------------------------------------------------------------
; LEFT HAND POSITION
; ------------------------------------------------------------
;
; W/Q/A/E = forward/back/left/right
; T/B     = up/down
;
move_forward      = 0x57    ; W
move_back         = 0x51    ; Q
move_left         = 0x41    ; A
move_right        = 0x45    ; E
move_up           = 0x54    ; T
move_down         = 0x42    ; B


; ------------------------------------------------------------
; LEFT HAND ROTATION
; ------------------------------------------------------------
;
; U/O = left/right
; Y/H = up/down
; 9/0 = roll left/right
;
rotate_left       = 0x55    ; U
rotate_right      = 0x4F    ; O
rotate_up         = 0x59    ; Y
rotate_down       = 0x48    ; H
rotate_roll_left  = 0x39    ; 9
rotate_roll_right = 0x30    ; 0


; ------------------------------------------------------------
; LEFT CONTROLLER BUTTONS
; ------------------------------------------------------------

a                 = 0x31    ; 1
b                 = 0x32    ; 2
x                 = 0x33    ; 3
y                 = 0x34    ; 4

trigger           = 0x5A    ; Z
grip              = 0x58    ; X
system            = 0x56    ; V

reset_pose        = 0x79    ; F10


; ============================================================
; RIGHT VR CONTROLLER
; ============================================================

[right_controller]

; ------------------------------------------------------------
; RIGHT JOYSTICK
; ------------------------------------------------------------
;
;          I
;          ^
;          |
;     J <--+--> L
;          |
;          v
;          K
;
joystick_up       = 0x49    ; I
joystick_down     = 0x4B    ; K
joystick_left     = 0x4A    ; J
joystick_right    = 0x4C    ; L

; No keyboard key is assigned to right joystick click.
; RMB is reserved exclusively for RIGHT GRIP.
joystick_click    = 0


; ------------------------------------------------------------
; RIGHT HAND POSITION
; ------------------------------------------------------------
;
; Arrow keys = forward/back/left/right
; [ / ]      = down/up
;
move_forward      = VK_UP
move_back         = VK_DOWN
move_left         = VK_LEFT
move_right        = VK_RIGHT
move_up           = 0x5D    ; ]
move_down         = 0x5B    ; [


; ------------------------------------------------------------
; RIGHT HAND ROTATION
; ------------------------------------------------------------
;
; ONLY these Numpad keys are used:
;
; Numpad 8 = up
; Numpad 2 = down
; Numpad 4 = left
; Numpad 6 = right
;
; Numpad 1/3/5/7/9 are unused.
;
rotate_left       = 0x64    ; Numpad 4
rotate_right      = 0x66    ; Numpad 6
rotate_up         = 0x68    ; Numpad 8
rotate_down       = 0x62    ; Numpad 2

; Roll is disabled in this first version.
rotate_roll_left  = 0
rotate_roll_right = 0


; ------------------------------------------------------------
; RIGHT CONTROLLER BUTTONS
; ------------------------------------------------------------

a                 = 0x35    ; 5
b                 = 0x36    ; 6
x                 = 0x37    ; 7
y                 = 0x38    ; 8


; ------------------------------------------------------------
; RIGHT TRIGGER / GRIP
; ------------------------------------------------------------
;
; Physical mouse buttons:
;
; LMB = RIGHT trigger
; RMB = RIGHT grip
;
trigger           = 0x01    ; VK_LBUTTON
grip              = 0x02    ; VK_RBUTTON


; ------------------------------------------------------------
; RIGHT SYSTEM / MENU
; ------------------------------------------------------------

system            = 0x50    ; P


; ------------------------------------------------------------
; RIGHT POSE RESET
; ------------------------------------------------------------

reset_pose        = 0x79    ; F10


; ------------------------------------------------------------
; RIGHT HAND SPEED
; ------------------------------------------------------------

pose_move_speed   = 0.5
pose_rotate_speed = 1.5


; ============================================================
; RESERVED / UNUSED INPUTS
; ============================================================
;
; Steam/SteamVR conflict avoidance:
;
;   S = UNUSED
;   M = UNUSED
;
; Navigation keys:
;
;   Home      = UNUSED
;   End       = UNUSED
;   Insert    = UNUSED
;   Delete    = UNUSED
;   Page Up   = UNUSED
;   Page Down = UNUSED
;
; Numpad:
;
;   1 = UNUSED
;   3 = UNUSED
;   5 = UNUSED
;   7 = UNUSED
;   9 = UNUSED
;
; Right controller roll is disabled.
;
; ============================================================
; MOUSE
; ============================================================
;
; Mouse buttons are assigned ONLY to the right controller:
;
;   LMB = RIGHT TRIGGER
;   RMB = RIGHT GRIP
;
; ============================================================
; RESET
; ============================================================
;
;   F10 = reset the virtual hand pose.
;
; F10 is intentionally assigned to both controllers, so it
; resets both virtual hand poses when pressed.
;
; ============================================================
; END OF CONFIGURATION
; ============================================================
